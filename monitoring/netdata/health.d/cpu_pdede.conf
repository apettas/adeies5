# PDEDE — CPU alerts με οδηγίες για το email

   template: 10min_cpu_usage
         on: system.cpu
      class: Utilization
       type: System
  component: CPU
host labels: _os=linux
     lookup: average -10m unaligned of user,system,softirq,irq,guest
      units: %
      every: 1m
       warn: $this > (($status >= $WARNING)  ? (75) : (80))
       crit: $this > (($status == $CRITICAL) ? (85) : (90))
      delay: down 15m multiplier 1.5 max 1h
    summary: [Adeies] Υψηλή χρήση CPU (10 λεπτά)
       info: Μέση χρήση CPU >80% για ~10 λεπτά (crit≥90%). Αιτία: βαριά αίτηση, PDF generation, backup, bots, ή container σε loop. Ενέργειες: 1) top/htop και docker stats 2) έλεγχος logs web/nginx 3) αν είναι επίθεση login δες Cloudflare/axes 4) αν είναι νόμιμο φόρτο, ανέβα resources ή περιόρισε παράλληλες εργασίες.
         to: sysadmin

   template: 10min_cpu_iowait
         on: system.cpu
      class: Utilization
       type: System
  component: CPU
host labels: _os=linux
     lookup: average -10m unaligned of iowait
      units: %
      every: 1m
       warn: $this > (($status >= $WARNING)  ? (20) : (30))
       crit: $this > (($status == $CRITICAL) ? (30) : (50))
      delay: up 15m down 30m multiplier 1.5 max 2h
    summary: [Adeies] Υψηλό CPU iowait (δίσκος αργός)
       info: Το CPU περιμένει τον δίσκο (iowait). Αιτία: αργό storage, γεμάτος δίσκος, βαριά εγγραφή DB/logs, backup σε εξέλιξη. Ενέργειες: 1) iostat / Netdata disk latency 2) έλεγχος ελεύθερου χώρου 3) απόφυγε βαριά jobs ώρα αιχμής 4) αν είναι VM σε αργό disk host, εξέτασε βελτίωση storage.
         to: sysadmin
