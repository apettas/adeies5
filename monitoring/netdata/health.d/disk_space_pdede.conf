# PDEDE — Disk alerts με οδηγίες για το email (πεδίο info εμφανίζεται στο Netdata mail)

    template: disk_space_usage
          on: disk.space
       class: Utilization
        type: System
   component: Disk
chart labels: mount_point=!/dev !/dev/* !/run !/run/* !HarddiskVolume* *
        calc: $used * 100 / ($avail + $used)
       units: %
       every: 1m
        warn: $this > (($status >= $WARNING ) ? (80) : (85))
        crit: ($this > (($status == $CRITICAL) ? (90) : (95))) && $avail < 10
       delay: up 1m down 15m multiplier 1.5 max 1h
     summary: [Adeies] Δίσκος ${label:mount_point} γεμάτος
        info: Ο δίσκος ${label:mount_point} ξεπέρασε το όριο χρήσης (warn≥85%, crit≥95%). Αιτία: logs, Docker volumes, backups ή media. Ενέργειες: 1) df -h και docker system df 2) καθάρισμα logs/nginx και παλιά backups στο /home/andre/adeies5/backups 3) docker system prune μόνο αν ξέρεις τι διαγράφεις 4) έλεγχος media/private_media. Αν γεμίζει γρήγορα δες Netdata disk fill rate.
          to: sysadmin

    template: disk_inode_usage
          on: disk.inodes
       class: Utilization
        type: System
   component: Disk
chart labels: mount_point=!/dev !/dev/* !/run !/run/* *
        calc: $used * 100 / ($avail + $used)
       units: %
       every: 1m
        warn: $this > (($status >= $WARNING)  ? (80) : (85))
        crit: $this > (($status == $CRITICAL) ? (90) : (95))
       delay: up 1m down 15m multiplier 1.5 max 1h
     summary: [Adeies] Inodes δίσκου ${label:mount_point}
        info: Πολλά μικρά αρχεία στο ${label:mount_point} (warn≥85% inodes). Αιτία: πολλά μικρά files σε logs/cache/tmp. Ενέργειες: 1) df -i 2) εύρεση φακέλων με πολλά αρχεία 3) καθάρισμα tmp/cache/logs. Ο χώρος GB μπορεί να φαίνεται OK ενώ τα inodes τελειώνουν.
          to: sysadmin

   template: out_of_disk_space_time
         on: disk.space
       calc: ($disk_fill_rate > 0) ? ($avail / $disk_fill_rate) : (inf)
      units: hours
      every: 1m
       warn: $this > 0 and $this < (($status >= $WARNING)  ? (48) : (24))
       crit: $this > 0 and $this < (($status == $CRITICAL) ? (24) : (8))
      delay: down 15m multiplier 1.2 max 1h
    summary: [Adeies] Ο δίσκος ${label:mount_point} θα γεμίσει σύντομα
       info: Με τον ρυθμό γραφής της τελευταίας ώρας ο δίσκος ${label:mount_point} εκτιμάται να γεμίσει σε λίγες ώρες. Ενέργειες: εντόπισε τι γράφει (logs, backup, docker) και σταμάτα/καθάρισε πριν γεμίσει τελείως (τότε σταματάει PostgreSQL/Docker).
         to: sysadmin
