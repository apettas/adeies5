# PDEDE — RAM alerts με οδηγίες για το email

      alarm: ram_in_use
         on: system.ram
      class: Utilization
       type: System
  component: Memory
host labels: _os=linux
       calc: $used * 100 / ($used + $cached + $free + $buffers)
      units: %
      every: 10s
       warn: $this > (($status >= $WARNING)  ? (80) : (85))
       crit: $this > (($status == $CRITICAL) ? (90) : (95))
      delay: down 15m multiplier 1.5 max 1h
    summary: [Adeies] Υψηλή χρήση μνήμης RAM
       info: Η χρήση RAM πέρασε το όριο (warn≥85%, crit≥95%). Αιτία: memory leak, πολλά containers, βαριά επεξεργασία. Ενέργειες: 1) free -h και docker stats 2) έλεγχος web/db/redis containers 3) restart μόνο του προβληματικού service αν χρειαστεί 4) αν επαναλαμβάνεται, αύξησε RAM του VM. Πρόσεξε το swap — αν ανεβαίνει, το σύστημα επιβραδύνει.
         to: sysadmin

      alarm: ram_available
         on: mem.available
      class: Utilization
       type: System
  component: Memory
host labels: _os=linux
       calc: $avail * 100 / ($system.ram.used + $system.ram.cached + $system.ram.free + $system.ram.buffers)
      units: %
      every: 10s
       warn: $this < (($status >= $WARNING)  ? (15) : (10))
       crit: $this < (($status == $CRITICAL) ? (10) : (5))
      delay: down 15m multiplier 1.5 max 1h
    summary: [Adeies] Χαμηλή διαθέσιμη RAM
       info: Απομένει λίγη διαθέσιμη RAM για νέες διεργασίες. Κίνδυνος OOM killer (μπορεί να σκοτώσει PostgreSQL/Gunicorn). Ενέργειες: 1) docker stats / free -h 2) σταμάτα μη αναγκαία processes 3) έλεγχος για leak στο web container 4) σχεδίασε αύξηση RAM αν είναι συχνό.
         to: sysadmin
