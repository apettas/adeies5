{% if needs_gdpr_consent %}
<div class="modal fade" id="gdprConsentModal" tabindex="-1" aria-labelledby="gdprConsentModalLabel"
     aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="gdprConsentModalLabel">
                    <i class="bi bi-shield-lock"></i> {{ gdpr_consent_title }}
                </h5>
            </div>
            <div class="modal-body">
                <div class="gdpr-consent-text mb-3" style="white-space: pre-line; line-height: 1.55;">{{ gdpr_consent_text }}</div>

                <p class="mb-4">
                    <i class="bi bi-file-earmark-text"></i>
                    Διαβάστε την
                    <a href="{% url 'privacy_policy' %}" target="_blank" rel="noopener noreferrer">
                        Πολιτική Απορρήτου &amp; Προστασίας Προσωπικών Δεδομένων (GDPR)
                    </a>.
                </p>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="gdprConsentCheckbox" required>
                    <label class="form-check-label" for="gdprConsentCheckbox">
                        Παρέχω τη συγκατάθεσή μου για την ανωτέρω επεξεργασία προσωπικών δεδομένων.
                    </label>
                </div>

                <div class="form-check mb-2">
                    <input class="form-check-input" type="checkbox" id="gdprDoNotShowCheckbox" required>
                    <label class="form-check-label" for="gdprDoNotShowCheckbox">
                        Κατανοώ ότι η συγκατάθεση θα καταγραφεί και δεν θα εμφανιστεί ξανά.
                    </label>
                </div>

                <div id="gdprConsentError" class="alert alert-danger mt-3 mb-0 py-2" style="display: none;"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" id="gdprConsentSubmitBtn" disabled>
                    <i class="bi bi-check2-circle"></i> Συνέχεια
                </button>
            </div>
        </div>
    </div>
</div>

<script nonce="{{ csp_nonce }}">
(function () {
    var modalEl = document.getElementById('gdprConsentModal');
    if (!modalEl || typeof bootstrap === 'undefined') return;

    var consentCb = document.getElementById('gdprConsentCheckbox');
    var doNotShowCb = document.getElementById('gdprDoNotShowCheckbox');
    var submitBtn = document.getElementById('gdprConsentSubmitBtn');
    var errorBox = document.getElementById('gdprConsentError');
    var acceptUrl = '{% url "accounts:accept_gdpr_consent" %}';
    var csrfToken = document.body.getAttribute('data-csrf-token') || '';

    function updateSubmitState() {
        submitBtn.disabled = !(consentCb.checked && doNotShowCb.checked);
    }

    consentCb.addEventListener('change', updateSubmitState);
    doNotShowCb.addEventListener('change', updateSubmitState);

    submitBtn.addEventListener('click', function () {
        if (!consentCb.checked || !doNotShowCb.checked) {
            errorBox.textContent = 'Πρέπει να τικάρετε και τα δύο πλαίσια για να συνεχίσετε.';
            errorBox.style.display = '';
            return;
        }
        errorBox.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Αποθήκευση...';

        var body = new URLSearchParams();
        body.set('consent', 'true');
        body.set('do_not_show_again', 'true');

        fetch(acceptUrl, {
            method: 'POST',
            headers: {
                'X-CSRFToken': csrfToken,
                'Content-Type': 'application/x-www-form-urlencoded',
                'X-Requested-With': 'XMLHttpRequest'
            },
            body: body.toString(),
            credentials: 'same-origin'
        }).then(function (res) {
            return res.json().then(function (data) {
                return { ok: res.ok, data: data };
            });
        }).then(function (result) {
            if (result.ok && result.data && result.data.success) {
                var instance = bootstrap.Modal.getInstance(modalEl);
                if (instance) instance.hide();
                return;
            }
            errorBox.textContent = (result.data && result.data.error) || 'Η αποθήκευση απέτυχε. Δοκιμάστε ξανά.';
            errorBox.style.display = '';
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="bi bi-check2-circle"></i> Συνέχεια';
            updateSubmitState();
        }).catch(function () {
            errorBox.textContent = 'Σφάλμα δικτύου. Δοκιμάστε ξανά.';
            errorBox.style.display = '';
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="bi bi-check2-circle"></i> Συνέχεια';
            updateSubmitState();
        });
    });

    document.addEventListener('DOMContentLoaded', function () {
        var modal = new bootstrap.Modal(modalEl);
        modal.show();
    });
})();
</script>
{% endif %}
